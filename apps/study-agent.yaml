apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: study-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:wownae-ct/k3s-repo.git
    targetRevision: main
    path: manifests/study-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: study-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
