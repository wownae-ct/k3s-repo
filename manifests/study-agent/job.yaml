apiVersion: batch/v1
kind: Job
metadata:
  name: study-agent
  namespace: study-agent
spec:
  template:
    spec:
      containers:
      - name: study-agent
        image: ghcr.io/wownae-ct/study-agent:dev-3
        imagePullPolicy: Always
      imagePullSecrets:
      - name: ghcr-credentials
      restartPolicy: Never
      nodeSelector:
        role: apps
  backoffLimit: 2
